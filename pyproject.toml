[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillcheckup"
version = "0.3.8"
description = "Audit the AI skill files installed on your machine for validity, security risks, conflicts, and token cost."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
skilldoctor = "skilldoctor:main"

[tool.setuptools]
py-modules = ["skilldoctor"]
