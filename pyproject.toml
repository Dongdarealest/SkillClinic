[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillclinic"
version = "0.4.6"
description = "Audit the AI skill files installed on your machine for validity, security risks, conflicts, and token cost."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
skillclinic = "skillclinic:main"
# Deprecated alias, kept so existing installs keep working.
skilldoctor = "skillclinic:main"

[tool.setuptools]
py-modules = ["skillclinic"]
