name: Release binaries

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: skillclinic-windows.exe
          - os: macos-latest
            name: skillclinic-macos
          - os: ubuntu-latest
            name: skillclinic-linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the standalone executable
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name skillclinic skillclinic.py
      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f dist/skillclinic.exe ]; then mv dist/skillclinic.exe "${{ matrix.name }}"; else mv dist/skillclinic "${{ matrix.name }}"; fi
          gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.name }}"

  attach-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Attach the installer payload and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" skillclinic.py skillclinic.py.sha256
