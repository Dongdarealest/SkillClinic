[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillcheckup"
version = "0.4.6"
description = "Deprecated: SkillDoctor is now SkillClinic. Install the skillclinic package instead."
readme = "DEPRECATED.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["skillclinic>=0.4.6"]

[project.scripts]
skilldoctor = "skilldoctor:main"

[tool.setuptools]
py-modules = ["skilldoctor"]
